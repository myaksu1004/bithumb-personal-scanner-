services:
  - type: web
    name: coin-higher-low-v5
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: EXCHANGE
        value: bithumb
